# A copy of program-libs/hasher of github.com/helius-labs/privacy-rings at commit 3c018b82
# (Apache-2.0, see LICENSE). Changes: `workspace = true` became a version, the dev-dependencies and
# the tests were left out. The versions of light-poseidon and ark-* stay at the ones of
# Cargo.lock and of vendor/light-poseidon: src/poseidon.rs is the same text as at 89640630, so
# the hashes do not change. The source in src/ is unchanged.
[package]
name = "spr-hasher"
version = "0.8.0"
description = "Trait for generic usage of hash functions on Solana"
license = "Apache-2.0"
edition = "2021"

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[dependencies]
thiserror = "2.0"
num-bigint = "0.4.6"
solana-program-error = "3.0"

[target.'cfg(not(target_os = "solana"))'.dependencies]
light-poseidon = "0.4.0"
ark-bn254 = "0.5"
sha2 = { version = "0.10" }
sha3 = { version = "0.10" }
ark-ff = "=0.5.0"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
