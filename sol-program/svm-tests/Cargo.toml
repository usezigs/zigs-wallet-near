[package]
name = "zigs-min-multisig-svm-tests"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# The tests run the SBF builds of the program and of the stub pool in LiteSVM, as the Zolana
# program tests do. This crate has its own lock file, so the test dependencies never change the
# versions that the program builds with. The program build never reads this lock.
[dependencies]
litesvm = { version = "0.16", features = ["precompiles"] }
sha2 = "0.10"
solana-clock = "3.0"
solana-ed25519-program = "3.0"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-pubkey = "4.2"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-transaction-error = "3.3"
spr-interface = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", default-features = false }

# tests/replay.rs (`sh sol-program/build.sh proofs`): the pool with a real proof, which needs a
# running prover of the pinned privacy-rings commit. `build.sh test` and CI do not build these.
num-bigint = { version = "0.4", optional = true }
spr-client = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", optional = true }
spr-hasher = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", optional = true }
spr-keypair = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", optional = true }
spr-merkle-tree = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", optional = true }
spr-program-test = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", optional = true }
spr-test-utils = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", optional = true }
spr-transaction = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", optional = true }
spr-tree = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", optional = true }

[features]
proofs = [
    "dep:num-bigint",
    "dep:spr-client",
    "dep:spr-hasher",
    "dep:spr-keypair",
    "dep:spr-merkle-tree",
    "dep:spr-program-test",
    "dep:spr-test-utils",
    "dep:spr-transaction",
    "dep:spr-tree",
]

[[test]]
name = "replay"
required-features = ["proofs"]

[workspace]
members = ["stub-pool"]

[profile.release]
overflow-checks = true
