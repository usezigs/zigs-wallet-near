[package]
name = "zigs-min-multisig"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "zigs_min_multisig"
crate-type = ["cdylib", "lib"]

[features]
default = ["bpf-entrypoint"]
bpf-entrypoint = []
no-entrypoint = []
# The cluster (SOL-42, src/cluster.rs): exactly one. It names the genesis hash only: the pool is
# the same on both.
devnet = []
mainnet = []

# The spr crates come from one pinned commit of privacy-rings (ZOLANA.md [Z]). The other versions match the
# Cargo.lock of that commit; build.sh builds with --locked.
[dependencies]
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6.0"
spr-hasher = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", default-features = false }
spr-interface = { git = "https://github.com/helius-labs/privacy-rings", rev = "3c018b82fbc08322114990b88906872f4e72d65c", default-features = false }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']

# Its own workspace: the program and its lock file stay apart from the tests and the repo root.
[workspace]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 2
